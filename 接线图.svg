<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
<style>
text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#111;font-size:18px}.title{font-size:28px;font-weight:bold}.part{fill:#fff;stroke:#111;stroke-width:2}.pin{font-size:16px}.note{font-size:15px}.wire{fill:none;stroke-width:4}.pwr{stroke:#d22}.gnd{stroke:#111}.i2c{stroke:#1769aa}.out1{stroke:#c66}.out2{stroke:#795}.out3{stroke:#946}.dot{fill:#111}
</style>
<rect width="1500" height="980" fill="#fff"/>
<text x="750" y="42" text-anchor="middle" class="title">ESP32 + PCA9548A + 3x MCP4725 + 100uA 电流表接线原理图</text>
<text x="750" y="70" text-anchor="middle" class="note">所有模块使用 3.3V；PCA9548A 电源脚为 VIN，MCP4725 电源脚为 VCC</text>

<!-- ESP32 -->
<rect x="55" y="170" width="260" height="310" class="part"/><text x="185" y="205" text-anchor="middle" class="title" style="font-size:22px">ESP32 Dev Module</text>
<text x="75" y="255" class="pin">3V3</text><text x="75" y="315" class="pin">GND</text><text x="75" y="375" class="pin">GPIO21 / SDA</text><text x="75" y="435" class="pin">GPIO22 / SCL</text>
<line x1="120" y1="250" x2="315" y2="250" class="wire pwr"/><line x1="120" y1="310" x2="315" y2="310" class="wire gnd"/><line x1="180" y1="370" x2="315" y2="370" class="wire i2c"/><line x1="180" y1="430" x2="315" y2="430" class="wire i2c"/>

<!-- PCA -->
<rect x="360" y="150" width="300" height="350" class="part"/><text x="510" y="185" text-anchor="middle" class="title" style="font-size:22px">PCA9548A</text><text x="510" y="210" text-anchor="middle" class="note">地址 0x70</text>
<text x="380" y="255" class="pin">VIN</text><text x="380" y="315" class="pin">GND</text><text x="380" y="375" class="pin">SDA</text><text x="380" y="435" class="pin">SCL</text>
<line x1="420" y1="250" x2="360" y2="250" class="wire pwr"/><line x1="420" y1="310" x2="360" y2="310" class="wire gnd"/><line x1="420" y1="370" x2="315" y2="370" class="wire i2c"/><line x1="420" y1="430" x2="315" y2="430" class="wire i2c"/>
<text x="480" y="275" class="pin">CH0: SD0 / SC0</text><text x="480" y="350" class="pin">CH1: SD1 / SC1</text><text x="480" y="425" class="pin">CH2: SD2 / SC2</text>

<!-- MCP modules -->
<g transform="translate(760,105)"><rect width="290" height="210" class="part"/><text x="145" y="35" text-anchor="middle" class="title" style="font-size:20px">MCP4725 CPU</text><text x="145" y="58" text-anchor="middle" class="note">地址 0x60 / PCA CH0</text><text x="20" y="100" class="pin">VCC</text><text x="20" y="145" class="pin">GND  GND</text><text x="20" y="190" class="pin">SDA   SCL</text><text x="205" y="120" class="pin">VOUT</text><line x1="65" y1="95" x2="0" y2="95" class="wire pwr"/><line x1="95" y1="140" x2="0" y2="140" class="wire gnd"/><line x1="95" y1="185" x2="0" y2="185" class="wire i2c"/><line x1="190" y1="115" x2="290" y2="115" class="wire out1"/></g>
<g transform="translate(760,370)"><rect width="290" height="210" class="part"/><text x="145" y="35" text-anchor="middle" class="title" style="font-size:20px">MCP4725 内存</text><text x="145" y="58" text-anchor="middle" class="note">地址 0x60 / PCA CH1</text><text x="20" y="100" class="pin">VCC</text><text x="20" y="145" class="pin">GND  GND</text><text x="20" y="190" class="pin">SDA   SCL</text><text x="205" y="120" class="pin">VOUT</text><line x1="65" y1="95" x2="0" y2="95" class="wire pwr"/><line x1="95" y1="140" x2="0" y2="140" class="wire gnd"/><line x1="95" y1="185" x2="0" y2="185" class="wire i2c"/><line x1="190" y1="115" x2="290" y2="115" class="wire out2"/></g>
<g transform="translate(760,635)"><rect width="290" height="210" class="part"/><text x="145" y="35" text-anchor="middle" class="title" style="font-size:20px">MCP4725 显存</text><text x="145" y="58" text-anchor="middle" class="note">地址 0x60 / PCA CH2</text><text x="20" y="100" class="pin">VCC</text><text x="20" y="145" class="pin">GND  GND</text><text x="20" y="190" class="pin">SDA   SCL</text><text x="205" y="120" class="pin">VOUT</text><line x1="65" y1="95" x2="0" y2="95" class="wire pwr"/><line x1="95" y1="140" x2="0" y2="140" class="wire gnd"/><line x1="95" y1="185" x2="0" y2="185" class="wire i2c"/><line x1="190" y1="115" x2="290" y2="115" class="wire out3"/></g>

<!-- connections to MCP left rails -->
<path d="M360 250 H700 V200 H760" class="wire pwr"/><path d="M315 310 H700 V510 H760" class="wire gnd"/><path d="M660 375 H700 V290 H760" class="wire i2c"/><path d="M660 430 H720 V290 H800" class="wire i2c"/>
<path d="M660 350 H690 V555 H760" class="wire i2c"/><path d="M660 350 H705 V555 H800" class="wire i2c"/><path d="M660 425 H680 V820 H760" class="wire i2c"/><path d="M660 425 H695 V820 H800" class="wire i2c"/>

<!-- meters -->
<g><rect x="1120" y="125" width="300" height="120" class="part"/><text x="1270" y="165" text-anchor="middle" class="title" style="font-size:20px">CPU 电流表</text><text x="1140" y="210" class="pin">+  正端</text><text x="1330" y="210" class="pin">-  负端</text><line x1="1050" y1="220" x2="1120" y2="220" class="wire out1"/><line x1="1420" y1="220" x2="1460" y2="220" class="wire gnd"/></g>
<g><rect x="1120" y="390" width="300" height="120" class="part"/><text x="1270" y="430" text-anchor="middle" class="title" style="font-size:20px">内存电流表</text><text x="1140" y="475" class="pin">+  正端</text><text x="1330" y="475" class="pin">-  负端</text><line x1="1050" y1="485" x2="1120" y2="485" class="wire out2"/><line x1="1420" y1="485" x2="1460" y2="485" class="wire gnd"/></g>
<g><rect x="1120" y="655" width="300" height="120" class="part"/><text x="1270" y="695" text-anchor="middle" class="title" style="font-size:20px">显存电流表</text><text x="1140" y="740" class="pin">+  正端</text><text x="1330" y="740" class="pin">-  负端</text><line x1="1050" y1="750" x2="1120" y2="750" class="wire out3"/><line x1="1420" y1="750" x2="1460" y2="750" class="wire gnd"/></g>
<line x1="1460" y1="220" x2="1460" y2="900" class="wire gnd"/><line x1="1460" y1="485" x2="1460" y2="485" class="wire gnd"/><line x1="1460" y1="750" x2="1460" y2="750" class="wire gnd"/><line x1="1460" y1="900" x2="1250" y2="900" class="wire gnd"/><text x="1240" y="930" class="pin">回 ESP32 GND</text>
<text x="55" y="930" class="note">红线=3.3V电源　黑线=GND　蓝线=I2C　彩色线=VOUT。两个 MCP4725 GND 均接同一 GND。</text>
</svg>
